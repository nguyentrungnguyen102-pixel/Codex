<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNPAYAGENT OS 2026 — Offline Preview</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#eaf1ff;background:#07111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#17366f,#07111f 48%,#0d1320);min-height:100vh}.app{display:flex;min-height:100vh}.side{width:278px;padding:20px;background:rgba(7,17,31,.82);border-right:1px solid rgba(148,163,184,.2);position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(135deg,#e21d38,#1f66d1);box-shadow:0 18px 50px rgba(31,102,209,.35);margin-bottom:18px}.brand b{display:block}.brand span{font-size:12px;opacity:.84}.nav button{width:100%;border:0;color:#eaf1ff;background:transparent;text-align:left;padding:12px 14px;margin:4px 0;border-radius:14px;cursor:pointer;font-weight:700}.nav button.active,.nav button:hover{background:rgba(89,154,255,.18);color:#93c5fd}.content{flex:1;padding:28px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.top p{margin:0;color:#94a3b8}.top h1{margin:4px 0 0;font-size:44px;letter-spacing:-.04em}.pill{display:inline-flex;border-radius:999px;padding:7px 11px;background:rgba(59,130,246,.16);color:#bfdbfe;font-size:12px;font-weight:800;margin-left:6px}.grid{display:grid;gap:16px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols5{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:rgba(15,23,42,.82);border:1px solid rgba(148,163,184,.18);border-radius:24px;padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.22);overflow:hidden}.card h3{margin:0 0 14px}.metric span{display:block;color:#94a3b8;margin-bottom:8px}.metric strong{font-size:24px}.warning{border-color:rgba(245,158,11,.55);background:rgba(120,53,15,.28)}.bars{display:flex;align-items:end;gap:12px;min-height:145px;padding-top:20px}.bars i{flex:1;min-width:28px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#60a5fa,#1f66d1);display:flex;align-items:start;justify-content:center;color:white;font-size:11px;padding-top:6px;font-style:normal}.donut{width:180px;height:180px;margin:8px auto;border-radius:50%;background:conic-gradient(#1f66d1 0 44%,#10b981 44% 62%,#e21d38 62% 78%,#f59e0b 78% 100%);position:relative}.donut:after{content:"";position:absolute;inset:42px;background:#0f172a;border-radius:50%}.service{border:1px solid rgba(148,163,184,.22);background:rgba(15,23,42,.72);border-radius:22px;padding:16px;color:#eaf1ff;text-align:left;cursor:pointer}.service.active{outline:3px solid rgba(96,165,250,.3)}.service span{display:block;color:#94a3b8;font-size:13px;margin-top:6px}.steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.steps div{flex:1 1 135px;background:rgba(148,163,184,.14);border-radius:16px;padding:12px;font-weight:800}.steps b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#10b981;color:#fff;margin-right:8px}input,select{width:100%;border:1px solid rgba(148,163,184,.24);background:rgba(15,23,42,.88);color:#eaf1ff;border-radius:14px;padding:11px 12px}label span{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px}.table{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:680px}th{text-align:left;color:#94a3b8;font-size:12px;text-transform:uppercase}th,td{padding:12px;border-bottom:1px solid rgba(148,163,184,.18)}td{font-weight:700}.btn{border:0;border-radius:14px;padding:11px 14px;background:linear-gradient(135deg,#e21d38,#1f66d1);color:#fff;font-weight:900;margin-top:12px}.muted{color:#94a3b8}.list{line-height:1.9}.hidden{display:none}.ok{color:#86efac}.danger{color:#fb7185}.invoice{border:1px dashed rgba(96,165,250,.45);padding:14px;border-radius:18px;background:rgba(59,130,246,.08)}@media(max-width:900px){.app{display:block}.side{width:auto;height:auto;position:relative}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.cols2,.cols3,.cols4,.cols5{grid-template-columns:1fr}.content{padding:18px}.top{display:block}.top h1{font-size:34px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div style="font-size:32px">✈</div><div><b>VNPAYAGENT OS</b><span>2026 Executive Demo</span></div></div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="content">
    <div class="top"><div><p>Version 2.2 — Offline HTML Preview</p><h1 id="title">Dashboard</h1></div><div><span class="pill">F1 → F2 → F3 → Customer</span><span class="pill">Mở trực tiếp bằng browser</span></div></div>
    <section id="page"></section>
  </main>
</div>
<script>
const fmt=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(n);
const dashboard={walletBalance:126800000,creditLimit:40000000,creditUsed:36500000,gmv:842000000,bookings:1284,chart:[52,68,61,82,74,96,112],rankings:[['Saigon Travel','Miền Nam',342000000,482],['Hanoi AirGo','Miền Bắc',286000000,391],['Danang BizTrip','Miền Trung',214000000,276]]};
const services=[['flight','Vé máy bay','GDS/API',['Search','Hold Booking','Check Wallet','Issue Ticket','Complete']],['bus','Xe khách','GDS/API',['Search','Hold Booking','Check Wallet','Issue Ticket','Complete']],['taxi','Taxi','Micro-services',['Booking','Deduct Wallet','Complete','Cashback']],['movie','Vé phim','Micro-services',['Booking','Deduct Wallet','Check-in','Cashback']],['hotel','Khách sạn','Lưu trú',['Check Room','Booking Request','Approval','Payment','Commission']]];
const scenarios={success:['Success','Giữ chỗ, trừ ví và xuất vé thành công.','Issue completed and invoice available'],timeout:['Timeout','NCC không phản hồi, tạo ticket hỗ trợ F1.','Create support ticket to F1'],empty:['Empty result','Không có chuyến/phòng phù hợp bộ lọc.','Relax filters or change date'],priceChanged:['Price changed','Giá realtime thay đổi trước khi issue.','Ask customer to accept fare difference'],holdExpired:['Hold expired','PNR hết hạn giữ chỗ, yêu cầu hold lại.','Hold booking again before issue']};
const bookings=[['VN8K2L','Flight','Nguyễn Minh Anh / 090***219','2026-06-18 09:20','Hold','F3 Nguyễn An',2380000],['BUS4Q9','Bus','Trần Quốc Bảo / 091***778','2026-06-20 22:00','Issued','F2 Saigon Travel',355000],['MOV9CP','Movie','Lê Hoàng Vy / 093***456','2026-05-22 19:30','Issued','F3 Nguyễn An',220000],['HTL2AP','Hotel','Phạm Gia Huy / 098***002','2026-07-01','Refund Pending','F2 Saigon Travel',2750000]];
const wallet=[['TX-001','Top-up',50000000,'Auto matching VA 9704***221','Completed'],['TX-002','Booking payment',-2380000,'Issue PNR VN8K2L','Completed'],['TX-003','Commission',11000,'CGV check-in MOV9CP','Completed'],['TX-004','Refund',1840000,'Refund after F1 approval HTL2AP','Pending'],['TX-005','Adjustment',-50000,'Manual correction by F1','Audited']];
const tickets=[['SUP-2026-118','VN8K2L','Đổi giờ bay','Open','18 phút'],['SUP-2026-119','HTL2AP','Lỗi hoàn tiền','In Progress','42 phút'],['SUP-2026-120','BUS4Q9','Sai tên','Resolved','Đúng hạn']];
const pages=['Dashboard','Auth','Booking','MMB','Wallet','Invoice','Admin','Risk','Support'];
const table=(h,rows)=>`<div class="table"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function dashboardPage(){return `<div class="grid cols4"><div class="card metric"><span>Wallet balance</span><strong>${fmt(dashboard.walletBalance)}</strong></div><div class="card metric"><span>Credit remaining</span><strong>${fmt(dashboard.walletBalance+dashboard.creditLimit-dashboard.creditUsed)}</strong></div><div class="card metric"><span>GMV tháng</span><strong>${fmt(dashboard.gmv)}</strong></div><div class="card metric"><span>Booking</span><strong>${dashboard.bookings.toLocaleString('vi-VN')}</strong></div></div><br><div class="grid cols2"><div class="card"><h3>GMV Dashboard</h3><div class="bars">${dashboard.chart.map(v=>`<i style="height:${v}px">${v}</i>`).join('')}</div></div><div class="card"><h3>Service Mix</h3><div class="donut"></div><p class="muted">Flight • Taxi • Movie • Hotel</p></div></div><br><div class="card"><h3>Agency Ranking</h3>${table(['Agency','Region','GMV','Bookings'],dashboard.rankings.map(r=>[r[0],r[1],fmt(r[2]),r[3]]))}</div>`}
function authPage(){return `<div class="grid cols3"><div class="card"><h3>Login</h3><label><span>Agency ID</span><input value="F2-SAIGON"></label><br><label><span>Password</span><input value="••••••••"></label><button class="btn">Đăng nhập</button></div><div class="card"><h3>OTP</h3><label><span>OTP SMS/Email</span><input value="202606"></label><p class="muted">Step-up auth khi issue ticket, refund hoặc đổi tài khoản nhận hóa đơn.</p><button class="btn">Xác thực OTP</button></div><div class="card"><h3>Forgot Password</h3><label><span>Email quản trị</span><input value="ops@saigontravel.vn"></label><p class="muted">Reset link + OTP bắt buộc theo chính sách F1.</p><button class="btn">Gửi reset link</button></div></div>`}
function bookingPage(){let s=services[0],sc=scenarios.success;return `<div class="grid cols5">${services.map((x,i)=>`<button class="service ${i?'':'active'}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div><br><div class="card"><h3>${s[1]} Business Flow</h3><p class="muted">Markup/commission mô phỏng theo service matrix.</p><div class="steps">${s[3].map((x,i)=>`<div><b>${i+1}</b>${x}</div>`).join('')}</div></div><br><div class="grid cols2"><div class="card"><h3>Search → Result → Detail</h3><div class="grid cols4"><label><span>Chặng</span><input value="SGN → HAN"></label><label><span>Ngày</span><input value="2026-06-18"></label><label><span>Hãng</span><input value="Vietnam Airlines"></label><label><span>Hạng vé</span><input value="Economy"></label></div>${table(['PNR','Net','Tax','Markup','Customer total'],[['VN8K2L',fmt(1780000),fmt(420000),fmt(180000),fmt(2380000)]])}</div><div class="card"><h3>Mock Scenario</h3><span class="pill ok">${sc[0]}</span><p>${sc[1]}</p><p class="muted">Next: ${sc[2]}</p><hr><p class="muted">Các case có sẵn: Success, Timeout, Empty result, Price changed, Hold expired.</p></div></div>`}
function mmbPage(){return `<div class="card"><h3>Manage My Booking</h3><input placeholder="Filter by PNR, SĐT, ngày khởi hành, trạng thái">${table(['PNR','Service','Customer (masked)','Departure','Status','Owner','Total'],bookings.map(b=>[...b.slice(0,6),fmt(b[6])]))}</div><br><div class="grid cols3"><div class="card"><h3>Ancillaries</h3><ul class="list"><li>Hành lý +23kg: check realtime price</li><li>Suất ăn: deduct wallet</li><li>Chỗ ngồi: update E-ticket</li></ul></div><div class="card"><h3>Refund</h3><p>Penalty fee: <b>${fmt(545000)}</b></p><p>Refundable: <b>${fmt(2205000)}</b></p><button class="btn">Submit F1 approval</button></div><div class="card"><h3>Re-book</h3><p class="muted">Select new itinerary → calculate fare difference → deduct wallet → re-issue ticket.</p></div></div>`}
function walletPage(){return `<div class="grid cols2"><div class="card"><h3>Wallet / Top-up / Audit Trail</h3><p class="invoice">Bank Transfer → Virtual Account → Auto Matching → Wallet Update</p>${table(['ID','Type','Amount','Note','Status'],wallet.map(w=>[w[0],w[1],fmt(w[2]),w[3],w[4]]))}</div><div class="card"><h3>Hóa đơn điện tử</h3><div class="grid cols2"><label><span>Tên công ty</span><input value="Công ty Saigon Travel"></label><label><span>MST</span><input value="0312345678"></label><label><span>Địa chỉ</span><input value="Quận 1, TP.HCM"></label><label><span>Email</span><input value="invoice@saigontravel.vn"></label></div><br><div class="invoice"><b>XML/PDF Preview</b><p>Issue Success → Request Invoice → Input Tax Info → Generate XML/PDF → Send Email</p></div></div></div>`}
function adminPage(){return `<div class="grid cols3"><div class="card"><h3>F1 Commission Config</h3>${table(['Provider','Commission'],[['Taxi Xanh SM','5%'],['CGV','8%'],['Hotel Partner','6%']])}</div><div class="card"><h3>Kill Switch</h3><ul class="list"><li>Khóa/Mở đại lý</li><li>Chặn login</li><li>Chặn trừ ví</li></ul><button class="btn">Block Issue Ticket</button></div><div class="card warning"><h3>Credit Limit</h3><p>Auto-Kill: chặn Issue Ticket và khóa công nợ quá hạn.</p><p>Remaining: <b>${fmt(2000000)}</b></p></div></div><br><div class="card"><h3>Fraud Detection</h3>${table(['Agency','IP','Type','Count','Severity'],[['F2-SAIGON','113.22.10.8','issue',4,'Medium'],['F2-SAIGON','113.22.10.8','refund',3,'Medium']])}</div><br><div class="card"><h3>F2 Markup & F3 Management</h3>${table(['Config','Value'],[['Nội địa','180.000đ/ticket'],['Quốc tế','2.2%'],['Xe khách','35.000đ/ticket'],['F3 commission','Auto split profit 40%']])}</div>`}
function supportPage(){return `<div class="grid cols2"><div class="card"><h3>Internal Ticketing trên PNR</h3><p class="muted">Open Booking → Create Ticket → Select Issue → Submit to F1.</p><div class="grid cols2"><label><span>PNR</span><input value="VN8K2L"></label><label><span>Issue</span><input value="Đổi giờ bay"></label></div><button class="btn">Submit to F1</button>${table(['Ticket','PNR','Issue','Status','SLA'],tickets)}</div><div class="card"><h3>Data Policy & Compliance</h3><div class="invoice"><b>F1</b><p>VNPAY / Master Agency</p><b>F2</b><p>Saigon Travel Agency</p><b>F3</b><p>CTV Nguyễn An</p></div><p><input type="checkbox" checked> Đồng ý xử lý dữ liệu cá nhân theo Nghị định 13</p><p class="muted">F3 sở hữu khách tự tạo; F2 xem danh sách có masking SĐT/Email.</p></div></div>`}
const render={Dashboard:dashboardPage,Auth:authPage,Booking:bookingPage,MMB:mmbPage,Wallet:walletPage,Invoice:walletPage,Admin:adminPage,Risk:adminPage,Support:supportPage};
function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===p));document.getElementById('title').textContent=p;document.getElementById('page').innerHTML=render[p]();}
document.getElementById('nav').innerHTML=pages.map(p=>`<button onclick="go('${p}')">${p}</button>`).join('');go('Dashboard');
</script>
</body>
</html>
